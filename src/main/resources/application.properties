spring.application.name=mocktails
# Impede o JPA de segurar conexão aberta e disparar queries escondidas no JSON
spring.jpa.open-in-view=false

#CONEX\u00c3\u0083O COM O MYSQL DO RAILWAY
spring.datasource.url=jdbc:mysql://root:weEkhfGJtXuYHLvnQAOqAIUdtWHqxYsb@switchback.proxy.rlwy.net:59207/railway
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#CONFIGURA\u00c3\u0087\u00c3\u0095ES DO JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true 

# Mantém conexões prontas com o Railway (evita lentidão no primeiro clique após pausa)
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.keepalive-time=30000

# Comprime JSON, HTML, CSS e JS
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript

